# The two bugs that would have shipped broken — a CSP that killed every button
# and a print sheet that produced a blank PDF — were both invisible locally and
# both statically checkable. Running the suite on every push is what turns that
# from a thing I happened to catch into a thing that cannot recur.
#
# No package.json on purpose: this is a static site with serverless functions,
# and the tests use only the Node standard library, so there is nothing to
# install and nothing for the deploy step to misread as a build.
name: tests

on:
  push:
    branches: ['**']
  pull_request:
  # so a run can be started by hand without an empty commit
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: pricing model
        run: node assets/model.test.js
      - name: deal ledger
        run: node assets/deals.test.js
      - name: catalog, scope rows and templates
        run: node assets/catalog.test.js
      - name: reading the specific client
        run: node assets/client.test.js
      - name: the unfinished draft
        run: node assets/draft.test.js
      - name: the guide — one instruction, plain words
        run: node assets/guide.test.js
      - name: what the call established, and the next question worth asking
        run: node assets/commitments.test.js
      - name: the worked example, end to end
        run: node assets/scenario.test.js
      - name: the proposal document
        run: node assets/proposal.test.js
      - name: the call transcript as input
        run: node assets/transcript.test.js
      # Which evidence a call actually carried, and therefore which cues the
      # engine is allowed to look for at all. The licence is the part worth
      # pinning: below the value rung the quantitative cues are not merely
      # unused, they are never read, and that is what stops a fee agreed in
      # the room from coming back as the cost of an incident.
      - name: the evidence ladder and what each rung may read
        run: node assets/ladder.test.js
      # Real speech has no digits in it. This converts spoken Hebrew numbers
      # for matching only and never for a quote, so a misconversion changes
      # what is found and never what is shown.
      - name: spoken numbers, for matching and never for quoting
        run: node assets/numerals.test.js
      - name: sending it out
        run: node assets/send.test.js
      - name: where the price came from
        run: node assets/flow.test.js
      - name: the visuals
        run: node assets/viz.test.js
      - name: the payment gate
        run: node assets/gate.test.js
      - name: user action labels match their outcomes
        run: node tools/action-contract.test.js
      - name: backup and restore
        run: node assets/backup.test.js
      # The journal is the only record of what the tool was worth, and it is
      # also the thing participants are asked to export and send back. It has
      # to hold statuses, counters and generated ids — and no client names.
      - name: the journal, and that it carries no names
        run: node assets/journal.test.js
      - name: who the proposal is from
        run: node assets/sender.test.js
      - name: chasing a proposal that went quiet
        run: node assets/followup.test.js
      - name: markup, CSP, print and telemetry contracts
        run: node assets/markup.test.js
      # The landing pages make claims. Each one names the capability behind it
      # and the test that holds it up, and a claim whose test stops existing
      # fails here rather than staying on the page.
      - name: the landing claims, against the capabilities behind them
        run: node assets/landing.test.js
      # Every Hebrew string the product ships has to have an English one.
      # A missing entry is not an error at runtime — it is a Hebrew sentence
      # in the middle of an English page, which nothing else would catch.
      - name: the second language — no string ships untranslated
        run: node assets/i18n.test.js
      - name: PRE-CALL — parsing, the anchor sentence, and the private/public split
        run: node assets/pre-call.test.js
      - name: api request guards
        run: node api/guard.test.js
      - name: the license endpoint
        run: node api/license.test.js
      - name: the event endpoint
        run: node api/event.test.js
      - name: the health endpoint
        run: node api/health.test.js
      - name: where a usage event goes, and whether it is kept
        run: node api/sink.test.js
      - name: what the tool's own advice has been worth
        run: node assets/history.test.js
      - name: the design scale, and that nothing invented a step of its own
        run: node assets/tokens.test.js
      - name: transfer weight and the no-dependency rule
        run: node assets/weight.test.js
      # A key has to satisfy the server allowlist AND the in-page checksum, and
      # those live in two files that know nothing about each other. This runs the
      # minted keys through the real keyValid() and the real endpoint regex, so a
      # retune of either one fails here instead of on a buyer's train.
      - name: issuing a licence key by hand
        run: node tools/mint-key.test.js

      # The attention model decides where copy gets cut and where the product
      # is allowed to end, so its arithmetic is worth pinning. Most of these
      # assert properties rather than numbers — that completion depends only
      # on the totals, that the one free parameter is solved against an
      # external benchmark rather than swept, that a funnel can be
      # structurally incapable of reaching a target no amount of editing
      # would fix. Those are the claims the report is allowed to make.
      - name: the attention model — what a word costs, and where the median leaves
        run: node tools/attention.test.js

  # The whole product, in a real browser, in all three engines it will
  # actually be opened in. Separate job because it is the only thing here
  # that needs an install step — everything above runs on the standard
  # library alone, and that property is worth keeping visible.
  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # axe-core belongs here and was missing for weeks. The a11y step ran
      # every push, failed to resolve it, printed "skipped" and exited 0 —
      # so the accessibility check was green without ever having scanned a
      # page. A11Y_REQUIRED below makes that failure mode loud.
      - name: install playwright, the three engines, and axe-core
        run: npm install --no-save playwright@1.62.1 axe-core@4.13.0 && npx playwright install --with-deps chromium firefox webkit
      - name: the journey — entry page through to a priced proposal
        run: node assets/journey.test.js
      # post-call.js is 47% of the code and had nothing of its own. Coverage
      # taken while the journey ran: 47 of its 77 functions entered, 30 never.
      # This drives the panel that reads a call — the part whose engine is
      # tested everywhere and whose wiring was tested nowhere.
      - name: the page's own wiring, driven by clicking it
        run: node assets/post-call.test.js
      # And the other tool, measured the same way: 24 of pre-call.js's 46
      # functions entered by the whole journey. The dark half included call
      # mode, which is the reason PRE-CALL exists.
      - name: PRE-CALL's own wiring, including the mode you are in during a call
        run: node assets/pre-call-page.test.js
      - name: accessibility — axe-core on every page, in every state
        env:
          A11Y_REQUIRED: '1'
        run: node assets/a11y.test.js
      # The same pages, repainted dark. A contrast ratio is a property of a
      # pairing, and the dark ramp re-pairs all of them — light-only was
      # half a scan.
      - name: accessibility — the same states, dark theme
        env:
          A11Y_REQUIRED: '1'
          PW_SCHEME: dark
        run: node assets/a11y.test.js
      # And the English overlay, which lays the same pages out left-to-right
      # with different label lengths. A translation can break a layout the
      # original passed, and the standard does not care which language broke it.
      - name: accessibility — the same states, in English
        env:
          A11Y_REQUIRED: '1'
          PW_LANG: en
        run: node assets/a11y.test.js
      - name: core web vitals on a throttled phone
        run: node assets/perf.test.js

      # The four faults a designer named — crowded, harsh, no hierarchy, and a
      # white sheet on a near-black page — as four numbers with thresholds and
      # the practitioner each came from. It reported for exactly one commit,
      # while the redesign was outstanding; it fails the build now.
      - name: design — density, hierarchy, saturation, surfaces
        run: node tools/design-audit.js